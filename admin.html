<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Site editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{--bg:#f3efe7;--ink:#181714;--muted:#6f6a61;--line:#ddd5c8;--accent:#b5472b;--card:#fbf9f4;--ok:#2f7d4f;--bad:#b3261e;--r:12px;
    --serif:'Bricolage Grotesque',system-ui,sans-serif;--sans:'Instrument Sans',system-ui,sans-serif;--mono:'JetBrains Mono',monospace}
  *{box-sizing:border-box;margin:0;padding:0}
  [hidden]{display:none!important}
  body{background:var(--bg);color:var(--ink);font:400 15px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
  button{font:inherit;color:inherit;cursor:pointer}
  a{color:inherit}
  input,textarea,select{font:inherit;color:var(--ink);width:100%;padding:10px 12px;background:#fff;border:1px solid var(--line);border-radius:10px;transition:border-color .2s,box-shadow .2s}
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(181,71,43,.15)}
  textarea{resize:vertical;line-height:1.5}
  .btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--ink);background:none;border-radius:100px;padding:10px 20px;font-weight:500;font-size:.88rem;transition:.2s;text-decoration:none;white-space:nowrap}
  .btn:hover{background:var(--ink);color:var(--bg)}
  .btn.fill{background:var(--ink);color:var(--bg)}
  .btn.fill:hover{background:var(--accent);border-color:var(--accent)}
  .btn.sm{padding:7px 14px;font-size:.8rem}
  .btn[disabled]{opacity:.45;pointer-events:none}

  /* login */
  #login{min-height:100vh;display:grid;place-items:center;padding:24px}
  .lcard{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:36px;width:min(420px,100%);box-shadow:0 30px 60px -30px rgba(24,23,20,.3)}
  .lcard h1{font:600 1.7rem var(--serif);letter-spacing:-.03em;margin-bottom:6px}
  .lcard p{color:var(--muted);margin-bottom:22px}
  .lcard label{display:block;font:500 .72rem var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}
  .lcard .btn{width:100%;justify-content:center;margin-top:22px;padding:12px}
  .err{color:var(--bad);font-size:.88rem;margin-top:12px;min-height:1.2em}

  /* app shell */
  #app{display:grid;grid-template-columns:260px 1fr;grid-template-rows:auto 1fr;min-height:100vh}
  .top{grid-column:1/3;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 20px;background:var(--ink);color:var(--bg);position:sticky;top:0;z-index:20}
  .top .brand{font:600 1.05rem var(--serif);letter-spacing:-.02em;margin-right:auto}
  .top .brand small{font:400 .66rem var(--mono);letter-spacing:.14em;text-transform:uppercase;opacity:.6;margin-left:10px}
  .chip{font:500 .68rem var(--mono);letter-spacing:.1em;text-transform:uppercase;padding:6px 12px;border-radius:100px;background:rgba(255,255,255,.12)}
  .chip.dirty{background:var(--accent);color:#fff}
  .chip.ok{background:rgba(47,125,79,.4)}
  .top .btn{border-color:rgba(243,239,231,.5);color:var(--bg)}
  .top .btn:hover{background:var(--bg);color:var(--ink)}
  .top .btn.fill{background:var(--bg);color:var(--ink);border-color:var(--bg)}
  .top .btn.fill:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
  nav.side{background:var(--card);border-right:1px solid var(--line);padding:16px 12px;overflow-y:auto;position:sticky;top:57px;height:calc(100vh - 57px)}
  nav.side .grp{font:500 .64rem var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--muted);padding:14px 12px 6px}
  nav.side button.nb{display:flex;width:100%;justify-content:space-between;align-items:center;gap:8px;text-align:left;background:none;border:0;border-radius:10px;padding:9px 12px;font-weight:500;transition:.15s}
  nav.side button.nb:hover{background:#efe9dc}
  nav.side button.nb.on{background:var(--ink);color:var(--bg)}
  nav.side .off{font:400 .6rem var(--mono);letter-spacing:.1em;text-transform:uppercase;opacity:.6}
  nav.side .tools{margin-top:18px;padding-top:14px;border-top:1px solid var(--line);display:grid;gap:8px}
  main{min-width:0;padding:26px clamp(16px,3vw,40px) 80px;max-width:980px;width:100%}
  .banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:#fff3d6;border:1px solid #e8cf8a;color:#5c4a12;border-radius:var(--r);padding:12px 16px;margin-bottom:18px;font-size:.9rem}
  .banner.info{background:#e9f1fb;border-color:#b9d0ee;color:#1f3a5c}
  .banner button{margin-left:auto}
  .shead h2{font:600 1.9rem var(--serif);letter-spacing:-.035em}
  .shead p{color:var(--muted);margin:4px 0 18px;max-width:62ch}
  .toggle{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px;margin-bottom:16px;font-weight:500}
  .toggle input{width:auto}
  .fields{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px 16px}
  .f{display:block}
  .f.wide,.f-area,.f-list,.f-img{grid-column:1/3}
  .f .l{display:block;font:500 .7rem var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
  .f small.hint{display:block;color:var(--muted);font-size:.8rem;margin-top:5px}
  .f-bool label.chk{display:flex;align-items:center;gap:10px;font-weight:500;padding-top:22px}
  .f-bool input{width:auto}

  /* media control */
  .media{display:grid;grid-template-columns:150px minmax(0,1fr);gap:14px;align-items:start}
  .media .prev{aspect-ratio:4/3;border-radius:10px;overflow:hidden;background:#e7e0d2;display:grid;place-items:center;border:1px solid var(--line)}
  .media .prev img,.media .prev video{width:100%;height:100%;object-fit:cover}
  .media .ph{font:400 .7rem var(--mono);color:var(--muted);letter-spacing:.08em}
  .media .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;align-items:center}
  .media .st{font-size:.82rem;color:var(--muted)}
  .media .st.bad{color:var(--bad)}

  /* lists */
  .list .items{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
  .f-list,.f-img{min-width:0}
  details.item{background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
  details.item[open]{border-color:#c9bfae;box-shadow:0 10px 24px -18px rgba(24,23,20,.4)}
  details.item>summary{display:flex;align-items:center;gap:12px;padding:11px 14px;cursor:pointer;list-style:none;font-weight:500}
  details.item>summary::-webkit-details-marker{display:none}
  details.item>summary::before{content:"▸";color:var(--muted);transition:transform .2s}
  details.item[open]>summary::before{transform:rotate(90deg)}
  .idx{font:500 .68rem var(--mono);color:var(--muted);min-width:20px}
  .st{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ia{display:flex;gap:4px}
  .ib{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:#fff;font-size:.82rem;transition:.15s}
  .ib:hover{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .ibody{padding:4px 14px 16px;border-top:1px solid var(--line);margin-top:2px;padding-top:14px}
  .list>.btn{margin-top:10px}

  #toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,30px);background:var(--ink);color:var(--bg);padding:12px 22px;border-radius:100px;font-size:.88rem;opacity:0;pointer-events:none;transition:.35s;z-index:99;max-width:90vw;text-align:center}
  #toast.show{opacity:1;transform:translate(-50%,0)}
  #toast.bad{background:var(--bad)}

  @media(max-width:820px){
    #app{grid-template-columns:minmax(0,1fr)}
    .top{grid-column:1}
    nav.side{position:static;height:auto;display:flex;gap:6px;overflow-x:auto;padding:10px;border-right:0;border-bottom:1px solid var(--line)}
    nav.side .grp,nav.side .tools{display:none}
    nav.side button.nb{width:auto;white-space:nowrap}
    .fields{grid-template-columns:minmax(0,1fr)}
    .f.wide,.f-area,.f-list,.f-img{grid-column:1}
    .media{grid-template-columns:minmax(0,1fr)}
    .media .prev{max-width:240px}
  }
</style>
</head>
<body>

<div id="login" hidden>
  <form class="lcard" id="loginForm">
    <h1>Site editor</h1>
    <p>Log in to edit the website.</p>
    <label for="lem">Email</label><input id="lem" type="email" autocomplete="username" required>
    <label for="lpw">Password</label><input id="lpw" type="password" autocomplete="current-password" required>
    <div class="err" id="lerr" role="alert"></div>
    <button class="btn fill" type="submit">Log in</button>
  </form>
</div>

<div id="app" hidden>
  <div class="top">
    <span class="brand">Site editor<small id="who"></small></span>
    <span class="chip" id="status">All published</span>
    <a class="btn sm" href="index.html" target="_blank" rel="noopener">View site</a>
    <button class="btn sm" id="previewBtn" type="button">Preview draft</button>
    <button class="btn sm fill" id="publishBtn" type="button">Publish</button>
    <button class="btn sm" id="logoutBtn" type="button" hidden>Log out</button>
  </div>
  <nav class="side" id="side"></nav>
  <main id="main"></main>
</div>
<input type="file" id="importFile" accept="application/json" hidden>
<div id="toast" role="status"></div>

<script src="config.js"></script>
<script src="content.js"></script>
<script src="store.js"></script>

  function changed() {
    clearTimeout(changed.t);
    changed.t = setTimeout(function () { Store.saveDraft(content); }, 300);
    updateStatus();
  }
  function isDirty() { return JSON.stringify(content) !== publishedStr; }
  function updateStatus() {
    var d = isDirty(), c = $('#status');
    c.textContent = d ? 'Unpublished changes' : 'All published';
    c.className = 'chip ' + (d ? 'dirty' : 'ok');
    drawNav();
  }

  /* ---------- controls ---------- */
  function ytThumb(u) { var m = String(u || '').match(/(?:youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/)|youtu\.be\/)([A-Za-z0-9_-]{11})/); return m ? 'https://img.youtube.com/vi/' + m[1] + '/hqdefault.jpg' : ''; }
  function mediaControl(f, obj, change, reg) {
    var setType = function (t) { if (f.typeKey) { obj[f.typeKey] = t; if (reg && reg[f.typeKey]) reg[f.typeKey].value = t; } };
    var kind = function () { return typeof f.kind === 'function' ? f.kind(obj) : (f.kind || 'image'); };
    var prev = h('div', { class: 'prev' }), status = h('span', { class: 'st' });
    var inp = h('input', { type: 'text', placeholder: 'Paste a link, or upload a file' });
    var file = h('input', { type: 'file', hidden: true });
    function paint() {
      var v = obj[f.k] || ''; prev.innerHTML = '';
      inp.value = v.indexOf('data:') === 0 ? '' : v;
      inp.placeholder = v.indexOf('data:') === 0 ? 'Uploaded photo (stored in the site)' : 'Paste a link, or upload a file';
      if (!v) return prev.append(h('span', { class: 'ph' }, 'NO FILE'));
      var yt = ytThumb(v), isVid = !yt && (kind() === 'video' || /\.(mp4|webm|mov|m4v)(\?|$)/i.test(v));
      if (yt) prev.append(h('img', { src: yt, alt: '' }));
      else if (isVid) { var vd = h('video', { src: v, muted: true, playsinline: true, preload: 'metadata' }); vd.muted = true; prev.append(vd); }
      else prev.append(h('img', { src: v, alt: '' }));
    }
    inp.addEventListener('input', function () { obj[f.k] = inp.value.trim(); var v = obj[f.k];
      if (f.typeKey) { var nt = ((f.yt && ytThumb(v)) || /\.(mp4|webm|mov|m4v|3gp)(\?|#|$)/i.test(v)) ? 'video' : (/\.(jpe?g|png|webp|gif|avif)(\?|#|$)/i.test(v) ? 'image' : null); if (nt) setType(nt); }
      prev.innerHTML = ''; if (v && ytThumb(v)) prev.append(h('img', { src: ytThumb(v), alt: '' })); else if (v) prev.append(kind() === 'video' ? h('video', { src: v, preload: 'metadata', muted: true }) : h('img', { src: v, alt: '' })); else prev.append(h('span', { class: 'ph' }, 'NO FILE')); change(); });
    var up = h('button', { type: 'button', class: 'btn sm', on: { click: function () { file.accept = f.typeKey ? 'image/*,video/*' : (kind() === 'video' ? 'video/*' : 'image/*'); file.value = ''; file.click(); } } }, f.typeKey ? 'Upload photo or video' : 'Upload file');
    var clr = h('button', { type: 'button', class: 'btn sm', on: { click: function () { obj[f.k] = ''; paint(); status.textContent = ''; change(); } } }, 'Remove');
    file.addEventListener('change', async function () {
      var fl = file.files[0]; if (!fl) return;
      var ext = (fl.name.split('.').pop() || '').toLowerCase();
      var isVid = /^video\//.test(fl.type) || /^(mp4|mov|m4v|webm|3gp|mkv)$/.test(ext);
      var isImg = /^image\//.test(fl.type) || /^(jpe?g|png|webp|gif|heic|heif|avif)$/.test(ext);
      var bad = function (m) { status.className = 'st bad'; status.textContent = m; };
      if (!isVid && !isImg) return bad('Please choose a photo or a video.');
      if (!f.typeKey && (kind() === 'video') !== isVid) return bad(kind() === 'video' ? 'Please choose a video file.' : 'Please choose a photo.');
      if (fl.size > 50 * 1024 * 1024) return bad('This file is ' + Math.round(fl.size / 1048576) + ' MB but the limit is 50 MB. Trim it on your phone, or upload it to YouTube and paste the link (projects only).');
      status.className = 'st'; status.textContent = 'Uploading…'; up.disabled = true;
      try {
        var url = await Store.upload(fl, function (p) { status.textContent = 'Uploading ' + Math.round(p * 100) + '%'; });
        setType(isVid ? 'video' : 'image'); obj[f.k] = url; paint(); status.textContent = 'Uploaded ✓'; change();
      } catch (e) { status.className = 'st bad'; status.textContent = e.message; }
      up.disabled = false;
    });
    paint();
    return h('div', { class: 'media' }, prev, h('div', {}, inp, h('div', { class: 'row' }, up, clr, status), file));
  }

  function listControl(f, obj, change) {
    var arr = obj[f.k] || (obj[f.k] = []);
    var itemsBox = h('div', { class: 'items' });
    var titleOf = function (o) { var t = f.title ? f.title(o) : o[f.tk]; return (t && String(t).trim()) || ('New ' + f.item); };
    function move(i, d) { var j = i + d; if (j < 0 || j >= arr.length) return; var t = arr[i]; arr[i] = arr[j]; arr[j] = t; build(); change(); }
    function dup(i) { var c = JSON.parse(JSON.stringify(arr[i])); delete c.id; if (c.title) c.title += ' (copy)'; arr.splice(i + 1, 0, c); if (openSet) openSet.add(c); build(); change(); }
    function del(i) { if (!confirm('Delete "' + titleOf(arr[i]) + '"?')) return; arr.splice(i, 1); build(); change(); }
    function itemEl(o, i) {
      var st = h('span', { class: 'st' }, titleOf(o));
      var ib = function (txt, tip, fn) { return h('button', { type: 'button', class: 'ib', title: tip, on: { click: function (e) { e.preventDefault(); e.stopPropagation(); fn(); } } }, txt); };
      var d = h('details', { class: 'item' },
        h('summary', {}, h('span', { class: 'idx' }, String(i + 1)), st, h('span', { class: 'ia' }, ib('↑', 'Move up', function () { move(i, -1); }), ib('↓', 'Move down', function () { move(i, 1); }), ib('⧉', 'Duplicate', function () { dup(i); }), ib('✕', 'Delete', function () { del(i); }))),
        h('div', { class: 'ibody' }, renderFields(f.fields, o, function () { st.textContent = titleOf(o); change(); })));
      if (openSet && openSet.has(o)) d.open = true;
      d.addEventListener('toggle', function () { if (openSet) { if (d.open) openSet.add(o); else openSet.delete(o); } });
      return d;
    }
    function build() { itemsBox.innerHTML = ''; arr.forEach(function (o, i) { itemsBox.append(itemEl(o, i)); }); }
    build();
    var add = h('button', { type: 'button', class: 'btn sm', on: { click: function () {
      var o = f.make(); arr.push(o); if (openSet) openSet.add(o); build(); change();
      var last = itemsBox.lastElementChild; if (last) last.scrollIntoView({ behavior: 'smooth', block: 'center' });
    } } }, '+ Add ' + f.item);
    return h('div', { class: 'list' }, itemsBox, add);
  }

  function control(f, obj, change, reg) {
    var w, lab = function (inner) { return h('label', { class: 'f f-' + f.t + (f.wide ? ' wide' : '') }, h('span', { class: 'l' }, f.l), inner, f.hint && f.t !== 'list' ? h('small', { class: 'hint' }, f.hint) : null); };
    if (f.t === 'text') { var i = h('input', { type: 'text', value: obj[f.k] == null ? '' : obj[f.k] }); i.addEventListener('input', function () { obj[f.k] = i.value; change(); }); return lab(i); }
    if (f.t === 'area') { var a = h('textarea', { rows: f.rows || 3 }); a.value = obj[f.k] == null ? '' : obj[f.k]; a.addEventListener('input', function () { obj[f.k] = a.value; change(); }); return lab(a); }
    if (f.t === 'num') { var n = h('input', { type: 'number', min: 2, max: 60, value: obj[f.k] == null ? '' : obj[f.k] }); n.addEventListener('input', function () { obj[f.k] = n.value === '' ? '' : +n.value; change(); }); return lab(n); }
    if (f.t === 'sel') {
      var s = h('select', {}, f.opts.map(function (o) { var v = Array.isArray(o) ? o[0] : o, t = Array.isArray(o) ? o[1] : o; return h('option', { value: v }, t); }));
      s.value = obj[f.k] == null ? f.opts[0][0] : obj[f.k]; if (s.value !== (obj[f.k] == null ? f.opts[0][0] : obj[f.k])) { s.append(h('option', { value: obj[f.k] }, obj[f.k])); s.value = obj[f.k]; }
      if (reg) reg[f.k] = s; s.addEventListener('change', function () { obj[f.k] = s.value; change(); }); return lab(s);
    }
    if (f.t === 'bool') { var c = h('input', { type: 'checkbox' }); c.checked = !!obj[f.k]; c.addEventListener('change', function () { obj[f.k] = c.checked; change(); }); return h('div', { class: 'f f-bool' }, h('label', { class: 'chk' }, c, f.l)); }
    if (f.t === 'img') return h('div', { class: 'f f-img' }, h('span', { class: 'l' }, f.l), mediaControl(f, obj, change, reg), f.hint ? h('small', { class: 'hint' }, f.hint) : null);
    if (f.t === 'list') return h('div', { class: 'f f-list' }, h('span', { class: 'l' }, f.l), f.hint ? h('small', { class: 'hint', style: 'margin:0 0 10px' }, f.hint) : null, listControl(f, obj, change));
    return h('div');
  }
  function renderFields(fields, obj, onchg) {
    var box = h('div', { class: 'fields' }), entries = [], reg = {};
    var upd = function () { entries.forEach(function (e) { e.w.hidden = e.f.showIf ? !e.f.showIf(obj) : false; }); };
    var change = function () { upd(); onchg(); };
    fields.forEach(function (f) { var w = control(f, obj, change, reg); entries.push({ w: w, f: f }); box.append(w); });
    upd(); return box;
  }

  /* ---------- screens ---------- */
  function drawNav() {
    var side = $('#side'); side.innerHTML = '';
    SCHEMA.forEach(function (s) {
      if (s.group) return side.append(h('div', { class: 'grp' }, s.group));
      var off = s.toggle && content.sections && content.sections[s.toggle] === false;
      side.append(h('button', { type: 'button', class: 'nb' + (s.key === current ? ' on' : ''), on: { click: function () { current = s.key; drawNav(); drawMain(); window.scrollTo(0, 0); } } }, h('span', {}, s.title), off ? h('span', { class: 'off' }, 'hidden') : null));
    });
    side.append(h('div', { class: 'tools' },
      h('button', { type: 'button', class: 'btn sm', on: { click: exportBackup } }, 'Download backup'),
      h('button', { type: 'button', class: 'btn sm', on: { click: function () { $('#importFile').click(); } } }, 'Restore from backup'),
      h('button', { type: 'button', class: 'btn sm', on: { click: resetAll } }, 'Reset to original')));
  }
  function drawMain() {
    var sec = SECS.filter(function (s) { return s.key === current; })[0], m = $('#main'); m.innerHTML = '';
    if (!Store.remote) m.append(h('div', { class: 'banner info' }, 'Demo mode: your edits are saved only in this browser and are not live yet. Connect Supabase in config.js to publish for everyone (see README).'));
    if (draftNote) m.append(h('div', { class: 'banner' }, 'You are continuing unpublished changes saved earlier in this browser.', h('button', { type: 'button', class: 'btn sm', on: { click: discardDraft } }, 'Discard them')));
    m.append(h('div', { class: 'shead' }, h('h2', {}, sec.title), h('p', {}, sec.desc)));
    if (sec.toggle) {
      var chk = h('input', { type: 'checkbox' }); chk.checked = content.sections[sec.toggle] !== false;
      chk.addEventListener('change', function () { content.sections[sec.toggle] = chk.checked; changed(); });
      m.append(h('label', { class: 'toggle' }, chk, 'Show this section on the website'));
    }
    if (!content[sec.key]) content[sec.key] = {};
    m.append(renderFields(sec.fields, content[sec.key], changed));
  }

  /* ---------- actions ---------- */
  function normalize(c) {
    [['portfolio'], ['onair'], ['courses'], ['members'], ['store'], ['blog']].forEach(function (p) {
      var seen = {}; ((c[p[0]] && c[p[0]].items) || []).forEach(function (o, i) {
        var id = o.id || Store.slug(o.title) || ('item-' + (i + 1)), base = id, n = 2;
        while (seen[id]) id = base + '-' + (n++);
        seen[id] = 1; o.id = id;
      });
    });
    c.hero.slides = (c.hero.slides || []).filter(function (s) { return s && s.src; });
    var iv = +c.hero.interval; c.hero.interval = isFinite(iv) ? Math.min(60, Math.max(2, iv)) : 6;
    return c;
  }
  async function publish() {
    if (!/^\S+@\S+\.\S+$/.test(content.site.email || '')) { current = 'site'; drawNav(); drawMain(); return toast('Please enter a valid email address first.', true); }
    var b = $('#publishBtn'); b.disabled = true; b.textContent = 'Publishing…';
    try {
      normalize(content); await Store.save(content);
      publishedStr = JSON.stringify(content); Store.clearDraft(); draftNote = false;
      toast(Store.remote ? 'Published. The live site is updated.' : 'Saved in this browser (demo mode).'); drawMain();
    } catch (e) { toast(e.message, true); }
    b.disabled = false; b.textContent = 'Publish'; updateStatus();
  }
  function preview() { Store.saveDraft(normalize(JSON.parse(JSON.stringify(content)))); window.open('index.html?preview=1', '_blank'); }
  var draftNote = false;
  function discardDraft() {
    if (!confirm('Throw away the unpublished changes and go back to the live version?')) return;
    Store.clearDraft(); content = JSON.parse(publishedStr); draftNote = false; drawNav(); drawMain(); updateStatus();
  }
  function exportBackup() {
    var blob = new Blob([JSON.stringify(content, null, 1)], { type: 'application/json' });
    var a = h('a', { href: URL.createObjectURL(blob), download: 'site-backup-' + new Date().toISOString().slice(0, 10) + '.json' }); document.body.append(a); a.click(); a.remove();
  }
  function resetAll() {
    if (!confirm('Replace everything in the editor with the original starting content? You can still undo by not publishing and discarding.')) return;
    content = Store.merge(Store.clone(window.DEFAULT_CONTENT), {}); drawNav(); drawMain(); changed();
  }
  $('#importFile').addEventListener('change', function (e) {
    var f = e.target.files[0]; if (!f) return;
    var r = new FileReader();
    r.onload = function () {
      try { var j = JSON.parse(r.result); if (!j.site || !j.hero) throw 0; content = Store.merge(Store.clone(window.DEFAULT_CONTENT), j); drawNav(); drawMain(); changed(); toast('Backup loaded. Click Publish to make it live.'); }
      catch (x) { toast('That file is not a valid backup.', true); }
    };
    r.readAsText(f); e.target.value = '';
  });

  /* ---------- start ---------- */
  async function startEditor() {
    $('#login').hidden = true; $('#app').hidden = false;
    var s = Store.getSession(); $('#who').textContent = Store.remote && s ? s.email : '';
    $('#logoutBtn').hidden = !Store.remote;
    var pub = await Store.loadPublished(); publishedStr = JSON.stringify(pub); content = Store.clone(pub);
    var dr = Store.getDraft();
    if (dr) { var merged = Store.merge(Store.clone(window.DEFAULT_CONTENT), dr); if (JSON.stringify(merged) !== publishedStr) { content = merged; draftNote = true; } else Store.clearDraft(); }
    drawNav(); drawMain(); updateStatus();
  }
  $('#publishBtn').addEventListener('click', publish);
  $('#previewBtn').addEventListener('click', preview);
  $('#logoutBtn').addEventListener('click', function () { Store.logout(); location.reload(); });
  addEventListener('keydown', function (e) { if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); if ($('#app').hidden === false) publish(); } });
  addEventListener('beforeunload', function (e) { if (content && isDirty() && !draftSafe()) { e.preventDefault(); e.returnValue = ''; } });
  function draftSafe() { return false; }

  $('#loginForm').addEventListener('submit', async function (e) {
    e.preventDefault(); var err = $('#lerr'); err.textContent = '';
    var btn = e.target.querySelector('button'); btn.disabled = true;
    try { await Store.login($('#lem').value.trim(), $('#lpw').value); await startEditor(); }
    catch (x) { err.textContent = x.message; }
    btn.disabled = false;
  });
  (async function () {
    if (await Store.isLoggedIn()) startEditor(); else $('#login').hidden = false;
  })();
})();
</script>
